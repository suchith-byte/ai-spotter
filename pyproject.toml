[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-detector"
version = "0.1.0"
description = "CLI tool to detect external AI service usage in repositories"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "AI Detector Team"}
]

dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
ai-detector = "ai_detector.cli:main"

[project.urls]
Homepage = "https://github.com/suchithnarayan/ai-spotter"
Repository = "https://github.com/suchithnarayan/ai-spotter"
Documentation = "https://github.com/suchithnarayan/ai-spotter#readme"
Issues = "https://github.com/suchithnarayan/ai-spotter/issues"

[tool.setuptools.packages.find]
include = ["ai_detector*"]

[tool.setuptools.package-data]
ai_detector = ["*.yaml"]

