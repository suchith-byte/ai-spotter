# AI Service Registry Configuration
# This file contains all AI services and their detection patterns.
# Add new services or modify patterns here without changing Python code.
#
# Pattern Syntax:
# - Use double quotes for patterns containing special characters
# - Backslashes need to be escaped as \
# - For complex patterns, use YAML literal block syntax (|)

services:
- name: OpenAI
  package_names:
  - openai
  - tiktoken
  - openai-python
  import_patterns:
  - from\s+openai\s+import
  - import\s+openai
  - from\s+langchain\.openai
  - from\s+openai\.
  api_endpoints:
  - api.openai.com
  - api.openai.com/v1
  - api.openai.com/v1/chat
  - api.openai.com/v1/completions
  config_key_patterns:
  - OPENAI_API_KEY
  - OPENAI_ORG_ID
  - OPENAI_API_BASE
  - OPENAI_MODEL
  - OPENAI_TEMPERATURE
  model_patterns:
  - gpt-[\d\.]+
  - gpt-4
  - gpt-3\.5
  - o1-[\w-]+
  - text-davinci-[\d]+
  - text-curie-[\d]+
  - text-babbage-[\d]+
  - text-ada-[\d]+
  - embedding-[\w-]+
  - text-embedding-[\w-]+
  - whisper-[\w-]+
  client_patterns:
  - OpenAI\s*\(
  - ChatOpenAI\s*\(
  - OpenAIEmbeddings\s*\(
  - OpenAIChat\s*\(
  - client\s*=\s*openai\.
- name: Anthropic
  package_names:
  - anthropic
  - '@anthropic-ai/sdk'
  import_patterns:
  - from\s+anthropic\s+import
  - import\s+anthropic
  - from\s+langchain\.anthropic
  - '@anthropic-ai/sdk'
  api_endpoints:
  - api.anthropic.com
  - api.anthropic.com/v1
  config_key_patterns:
  - ANTHROPIC_API_KEY
  - ANTHROPIC_API_VERSION
  model_patterns:
  - claude-[\d\.]+
  - claude-instant-[\d\.]+
  - claude-sonnet-[\d\.]+
  - claude-opus-[\d\.]+
  - claude-haiku-[\d\.]+
  client_patterns:
  - Anthropic\s*\(
  - ChatAnthropic\s*\(
  - AnthropicClient\s*\(
- name: Google AI
  package_names:
  - google-generativeai
  - google-cloud-aiplatform
  - vertexai
  - '@google/generative-ai'
  import_patterns:
  - from\s+google\.generativeai\s+import
  - import\s+google\.generativeai
  - from\s+google\.cloud\s+import\s+aiplatform
  - from\s+vertexai\s+import
  - from\s+langchain\.google
  - '@google/generative-ai'
  api_endpoints:
  - generativelanguage.googleapis.com
  - aiplatform.googleapis.com
  - us-central1-aiplatform.googleapis.com
  - generativelanguage.googleapis.com/v1
  config_key_patterns:
  - GOOGLE_AI_API_KEY
  - GOOGLE_APPLICATION_CREDENTIALS
  - GEMINI_API_KEY
  - GOOGLE_API_KEY
  model_patterns:
  - gemini-[\w-]+
  - gemini-pro
  - gemini-ultra
  - text-bison
  - chat-bison
  - code-bison
  client_patterns:
  - genai\s*\.\s*configure
  - ChatGoogleGenerativeAI\s*\(
  - VertexAI\s*\(
  - GoogleGenerativeAI\s*\(
- name: Hugging Face
  package_names:
  - transformers
  - huggingface_hub
  - datasets
  - accelerate
  - sentencepiece
  - tokenizers
  import_patterns:
  - from\s+transformers\s+import
  - import\s+transformers
  - from\s+huggingface_hub\s+import
  - from\s+langchain\.huggingface
  - '@huggingface/'
  api_endpoints:
  - api-inference.huggingface.co
  - huggingface.co
  - inference-api.huggingface.co
  config_key_patterns:
  - HUGGINGFACE_API_KEY
  - HF_API_KEY
  - HF_TOKEN
  - HUGGING_FACE_HUB_TOKEN
  model_patterns:
  - model\s*[:=]\s*["']?[\w-]+/[\w-]+
  - meta-llama/[\w-]+
  - bigscience/bloom
  - google/flan-[\w-]+
  - hf_[\w-]+/[\w-]+
  client_patterns:
  - pipeline\s*\(
  - HuggingFacePipeline\s*\(
  - HuggingFaceHub\s*\(
  - AutoModelFor
  - AutoTokenizer
- name: LangChain
  package_names:
  - langchain
  - langchain-core
  - langchain-community
  - langchain-openai
  - langsmith
  import_patterns:
  - from\s+langchain\s+import
  - import\s+langchain
  - from\s+langchain\.
  - from\s+langsmith\s+import
  api_endpoints:
  - api.smith.langchain.com
  config_key_patterns:
  - LANGCHAIN_API_KEY
  - LANGCHAIN_TRACING_V2
  - LANGCHAIN_ENDPOINT
  - LANGSMITH_API_KEY
  model_patterns: []
  client_patterns:
  - LLMChain\s*\(
  - ConversationChain\s*\(
  - (?:langchain|LangChain).*Agent\s*\(
  - from\s+langchain.*Agent
  - ^Agent\s*\(
  - RetrievalQA\s*\(
  - VectorStore\s*\(
